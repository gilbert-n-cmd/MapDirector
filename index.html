<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Direct Me to Tarantino</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; overflow-x: hidden;
  }
  h1 { font-size: 1.9rem; margin-bottom: 8px; font-weight: 800; letter-spacing: -1px; }
  h1 span { color: #e50914; }
  .subtitle { color: #888; margin-bottom: 28px; font-size: 0.95rem; }

  #directBtn {
    background: #e50914; color: white; border: none;
    padding: 18px 44px; font-size: 1.2rem; font-weight: 700;
    border-radius: 50px; cursor: pointer;
    box-shadow: 0 0 40px rgba(229,9,20,0.4);
    transition: transform 0.15s;
  }
  #directBtn:hover { transform: scale(1.05); }
  #directBtn:disabled { opacity: 0.5; cursor: wait; }

  #compassView { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
  #compassView.active { display: flex; }

  #mapContainer {
    width: 100%; height: 220px; border-radius: 16px; overflow: hidden;
    margin-bottom: 16px; border: 1px solid #333;
  }

  /* Pulsing destination marker */
  .pulse-marker {
    width: 20px; height: 20px; position: relative; cursor: pointer;
  }
  .pulse-marker .dot {
    width: 16px; height: 16px; background: #e50914; border-radius: 50%;
    position: absolute; top: 2px; left: 2px;
    box-shadow: 0 0 10px rgba(229,9,20,0.9);
  }
  .pulse-marker .ring {
    width: 20px; height: 20px; border: 2px solid #e50914; border-radius: 50%;
    position: absolute; top: 0; left: 0;
    animation: pulse 2s ease-out infinite;
  }
  .pulse-marker .ring:nth-child(3) { animation-delay: 1s; }
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 1; }
    100% { transform: scale(3.5); opacity: 0; }
  }

  /* Current turn instruction banner */
  #instruction {
    background: #1a1a1a; border: 1px solid #333; border-left: 4px solid #e50914;
    padding: 12px 16px; border-radius: 10px; width: 100%;
    text-align: left; margin-bottom: 14px; display: none;
  }
  #instruction.active { display: block; }
  #instructionIcon { font-size: 1.4rem; margin-right: 8px; vertical-align: middle; }
  #instructionText { font-size: 1rem; font-weight: 600; }
  #instructionDist { color: #888; font-size: 0.8rem; margin-top: 4px; }

  /* Full steps list */
  #stepsToggle {
    background: none; border: none; color: #888; font-size: 0.8rem;
    cursor: pointer; margin-bottom: 14px; text-decoration: underline;
    padding: 0;
  }
  #stepsList {
    display: none; width: 100%; text-align: left; margin-bottom: 14px;
    background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
    padding: 8px 0; max-height: 200px; overflow-y: auto;
  }
  #stepsList.active { display: block; }
  #stepsList .step {
    padding: 8px 16px; border-bottom: 1px solid #222;
    font-size: 0.85rem; color: #ccc; display: flex; align-items: flex-start;
  }
  #stepsList .step:last-child { border-bottom: none; }
  #stepsList .step .s-icon { margin-right: 10px; flex-shrink: 0; }
  #stepsList .step.current { color: #fff; font-weight: 600; background: rgba(229,9,20,0.1); }

  .compass-ring {
    width: min(55vw, 200px); height: min(55vw, 200px);
    border-radius: 50%; border: 2px solid #333;
    position: relative; display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px; background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%);
    flex-shrink: 0;
  }
  .compass-ring::before, .compass-ring::after {
    content: ''; position: absolute; background: #333;
  }
  .compass-ring::before { width: 1px; height: 100%; }
  .compass-ring::after { width: 100%; height: 1px; }

  #arrow {
    font-size: min(22vw, 90px); line-height: 1;
    transition: transform 0.25s ease-out;
    filter: drop-shadow(0 0 20px rgba(229,9,20,0.7));
    z-index: 2; user-select: none;
  }

  #distance { font-size: 1.4rem; font-weight: 700; margin-bottom: 2px; }
  #distanceLabel { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }
  #status { margin-top: 10px; color: #666; font-size: 0.75rem; max-width: 320px; }
  #arrived { display: none; font-size: 1.4rem; color: #4ade80; font-weight: 700; margin-top: 10px; }
  #arrived.active { display: block; }

  #shareSection { margin-top: 24px; display: none; flex-direction: column; align-items: center; gap: 8px; }
  #shareSection.active { display: flex; }
  #qrcode { background: #fff; padding: 8px; border-radius: 8px; }
  #shareLabel { color: #888; font-size: 0.75rem; }
</style>
</head>
<body>

<div id="introView">
  <h1>Direct Me to <span>Tarantino</span></h1>
  <p class="subtitle">Follow the arrow or the route. Get to the destination.</p>
  <button id="directBtn">📍 Direct Me</button>
</div>

<div id="compassView">
  <div id="mapContainer"></div>

  <div id="instruction">
    <div><span id="instructionIcon">➡️</span><span id="instructionText">Loading route…</span></div>
    <div id="instructionDist"></div>
  </div>
  <button id="stepsToggle">Show all steps ▾</button>
  <div id="stepsList"></div>

  <div class="compass-ring"><div id="arrow">⬆️</div></div>
  <div id="distance">--</div>
  <div id="distanceLabel">meters away</div>
  <div id="arrived">🎬 You've arrived!</div>
  <p id="status">Move your device to update direction.</p>
</div>

<div id="shareSection">
  <div id="qrcode"></div>
  <p id="shareLabel">Scan to share this page</p>
</div>

<script>
// ============================================================
// CONFIG — REPLACE WITH YOUR OWN VALUES
// ============================================================
const MAPBOX_TOKEN = 'pk.eyJ1IjoiZ2lsYmVydGF0dW1hNSIsImEiOiJjbXdmNjRjMDcwNWUyMnhzNHMxOW5taXhqIn0.DuX3hwuBWjtWks7nHtObsw';
const TARGET = { lat: 3.0303407, lng: 30.9073000 };const ARRIVAL_RADIUS = 15;
const STEP_ADVANCE_RADIUS = 20; // meters — how close before advancing to next step
// ============================================================

mapboxgl.accessToken = MAPBOX_TOKEN;

const introView   = document.getElementById('introView');
const compassView = document.getElementById('compassView');
const directBtn   = document.getElementById('directBtn');
const arrow       = document.getElementById('arrow');
const distanceEl  = document.getElementById('distance');
const statusEl    = document.getElementById('status');
const arrivedEl   = document.getElementById('arrived');
const shareSection= document.getElementById('shareSection');
const instructionEl      = document.getElementById('instruction');
const instructionIcon    = document.getElementById('instructionIcon');
const instructionText    = document.getElementById('instructionText');
const instructionDist    = document.getElementById('instructionDist');
const stepsToggle = document.getElementById('stepsToggle');
const stepsList   = document.getElementById('stepsList');

let map = null, mapLoaded = false, watchId = null;
let heading = null, currentPos = null;
let routeDrawn = false, lastRouteOrigin = null;
let steps = [];            // parsed steps
let currentStepIndex = 0;  // index into steps

function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function bearing(lat1, lng1, lat2, lng2) {
  const φ1 = toRad(lat1), φ2 = toRad(lat2), Δλ = toRad(lng2 - lng1);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// Map maneuver modifier/type → emoji icon
function maneuverIcon(step) {
  const t = step.maneuver.type;
  const m = step.maneuver.modifier || '';
  if (t === 'arrive') return '🎬';
  if (t === 'depart') return '🚶';
  if (m.includes('left'))  return '⬅️';
  if (m.includes('right')) return '➡️';
  if (m.includes('sharp left'))  return '↰';
  if (m.includes('sharp right')) return '↱';
  if (m.includes('slight left'))  return '↖️';
  if (m.includes('slight right')) return '↗️';
  if (t === 'roundabout' || t === 'rotary') return '🔄';
  if (t === 'merge') return '🔀';
  return '⬆️';
}

function fmtDist(m) {
  return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
}

function updateArrow() {
  if (!currentPos) return;
  const dist = distanceMeters(currentPos.latitude, currentPos.longitude, TARGET.lat, TARGET.lng);
  distanceEl.textContent = fmtDist(dist);

  if (dist <= ARRIVAL_RADIUS) {
    arrivedEl.classList.add('active');
    arrow.style.transform = 'rotate(0deg) scale(1.2)';
    arrow.textContent = '🎬';
    return;
  }
  arrivedEl.classList.remove('active');

  const targetBearing = bearing(currentPos.latitude, currentPos.longitude, TARGET.lat, TARGET.lng);
  const rotation = heading !== null ? (targetBearing - heading + 360) % 360 : targetBearing;
  arrow.style.transform = `rotate(${rotation}deg)`;
  statusEl.textContent = heading !== null
    ? 'Arrow points toward Tarantino relative to your facing direction.'
    : 'Compass unavailable — arrow points from North.';
}

// Find the closest step to current position and highlight it
function updateCurrentStep() {
  if (!currentPos || steps.length === 0) return;

  // Find first step whose maneuver location is within STEP_ADVANCE_RADIUS
  // of our current position, starting from currentStepIndex
  for (let i = currentStepIndex; i < steps.length; i++) {
    const s = steps[i];
    const [lng, lat] = s.maneuver.location;
    const d = distanceMeters(currentPos.latitude, currentPos.longitude, lat, lng);
    if (d <= STEP_ADVANCE_RADIUS) {
      currentStepIndex = Math.min(i + 1, steps.length - 1);
    }
  }

  renderInstruction();
  renderStepsList();
}

function renderInstruction() {
  const s = steps[currentStepIndex];
  if (!s) return;
  instructionEl.classList.add('active');
  instructionIcon.textContent = maneuverIcon(s);
  instructionText.textContent = s.maneuver.instruction;

  // Distance from current position to this step's maneuver point
  const [lng, lat] = s.maneuver.location;
  const d = currentPos
    ? distanceMeters(currentPos.latitude, currentPos.longitude, lat, lng)
    : s.distance;
  instructionDist.textContent = `${fmtDist(d)} until this step`;
}

function renderStepsList() {
  stepsList.innerHTML = '';
  steps.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'step' + (i === currentStepIndex ? ' current' : '');
    div.innerHTML = `<span class="s-icon">${maneuverIcon(s)}</span>
                     <span>${s.maneuver.instruction}<br>
                     <small style="color:#666">${fmtDist(s.distance)}</small></span>`;
    stepsList.appendChild(div);
  });
}

stepsToggle.addEventListener('click', () => {
  stepsList.classList.toggle('active');
  const open = stepsList.classList.contains('active');
  stepsToggle.textContent = open ? 'Hide all steps ▴' : 'Show all steps ▾';
});

async function fetchWalkingRoute() {
  if (!currentPos || !mapLoaded) return;

  if (lastRouteOrigin) {
    const moved = distanceMeters(lastRouteOrigin.lat, lastRouteOrigin.lng,
                                  currentPos.latitude, currentPos.longitude);
    if (moved < 30) return;
  }

  const url = `https://api.mapbox.com/directions/v5/mapbox/walking/` +
    `${currentPos.longitude},${currentPos.latitude};${TARGET.lng},${TARGET.lat}` +
    `?geometries=geojson&overview=full&steps=true&access_token=${MAPBOX_TOKEN}`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.routes || !data.routes.length) return;

    const route = data.routes[0];
    const coords = route.geometry.coordinates;

    // Parse steps
    steps = (route.legs[0].steps || []).map(s => ({
      distance: s.distance,
      duration: s.duration,
      maneuver: {
        type: s.maneuver.type,
        modifier: s.maneuver.modifier,
        location: s.maneuver.location,
        instruction: s.maneuver.instruction
      }
    }));

    // Reset step tracker when route changes
    if (!routeDrawn || !lastRouteOrigin ||
        distanceMeters(lastRouteOrigin.lat, lastRouteOrigin.lng,
                       currentPos.latitude, currentPos.longitude) > 100) {
      currentStepIndex = 0;
    }

    // Draw route
    if (map.getSource('route')) {
      map.removeLayer('route');
      map.removeSource('route');
    }
    map.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } }
    });
    map.addLayer({
      id: 'route', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#e50914', 'line-width': 5, 'line-opacity': 0.9 }
    });

    const bounds = new mapboxgl.LngLatBounds();
    coords.forEach(c => bounds.extend(c));
    map.fitBounds(bounds, { padding: 40 });

    lastRouteOrigin = { lat: currentPos.latitude, lng: currentPos.longitude };
    routeDrawn = true;

    renderInstruction();
    renderStepsList();
  } catch (e) {
    console.warn('Route fetch failed:', e);
  }
}

function initMap() {
  map = new mapboxgl.Map({
    container: 'mapContainer',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [TARGET.lng, TARGET.lat],
    zoom: 12,
    interactive: false
  });

  map.on('load', () => {
    mapLoaded = true;

    // Pulsing destination marker
    const pulseEl = document.createElement('div');
    pulseEl.className = 'pulse-marker';
    pulseEl.innerHTML = '<div class="ring"></div><div class="ring"></div><div class="dot"></div>';

    new mapboxgl.Marker({ element: pulseEl, anchor: 'center' })
      .setLngLat([TARGET.lng, TARGET.lat])
      .addTo(map);

    fetchWalkingRoute();
  });
}

function onPosition(pos) {
  currentPos = pos.coords;
  updateArrow();
  updateCurrentStep();

  if (mapLoaded) {
    fetchWalkingRoute();
    if (!window._userMarker) {
      window._userMarker = new mapboxgl.Marker({ color: '#4ade80' })
        .setLngLat([currentPos.longitude, currentPos.latitude])
        .addTo(map);
    } else {
      window._userMarker.setLngLat([currentPos.longitude, currentPos.latitude]);
    }
  }
}

function onError(err) { statusEl.textContent = 'Location error: ' + err.message; }

function onHeading(e) {
  if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
    heading = e.webkitCompassHeading;
  } else if (e.alpha !== null) {
    heading = (360 - e.alpha) % 360;
  }
  updateArrow();
}

function generateQR() {
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), {
    text: window.location.href, width: 120, height: 120,
    colorDark: '#000', colorLight: '#fff',
    correctLevel: QRCode.CorrectLevel.M
  });
  shareSection.classList.add('active');
}

directBtn.addEventListener('click', () => {
  if (!navigator.geolocation) { alert('Geolocation is not supported.'); return; }
  directBtn.disabled = true;
  directBtn.textContent = 'Getting location…';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentPos = pos.coords;
      introView.style.display = 'none';
      compassView.classList.add('active');
      initMap();

      watchId = navigator.geolocation.watchPosition(
        onPosition, onError,
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
      );

      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(res => {
              if (res === 'granted') {
                window.addEventListener('deviceorientationabsolute', onHeading, true);
                window.addEventListener('deviceorientation', onHeading, true);
              }
            }).catch(console.error);
        } else {
          window.addEventListener('deviceorientationabsolute', onHeading, true);
          window.addEventListener('deviceorientation', onHeading, true);
        }
      }

      updateArrow();
      generateQR();
    },
    (err) => {
      directBtn.disabled = false;
      directBtn.textContent = '📍 Direct Me';
      alert('Location error: ' + err.message + '\n\nAllow location access and use HTTPS.');
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
});
</script>
</body>
</html>
